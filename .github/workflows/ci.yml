name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/civicgrid
      AUTH_SECRET: ci-build-secret-change-me
      NEXTAUTH_SECRET: ci-build-secret-change-me
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ci-placeholder
      OWM_API_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
